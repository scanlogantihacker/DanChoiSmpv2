name: Build JAR

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o DanChoiSmpAnticheat_v1.2.0.zip
          if [ -d DanChoiSmpAnticheat_v1.2.0 ]; then
            cp -r DanChoiSmpAnticheat_v1.2.0/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DanChoiSmpAnticheat
          path: target/DanChoiSmpAnticheat.jar
