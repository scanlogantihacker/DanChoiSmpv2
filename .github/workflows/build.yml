name: Build JAR

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:   # cho phép bấm Build thủ công

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DanChoiSmpAnticheat
          path: target/DanChoiSmpAnticheat.jar
